<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Airborne Aces 1933 - One Thumb Gaming</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    /* ========== LOADING SCREEN ========== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-full {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .loading-area {
      position: absolute;
      bottom: 9%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      z-index: 10;
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(180, 210, 240, 0.85);
      font-weight: 500;
      animation: pulse-text 1.5s ease-in-out infinite;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .progress-bar-track {
      width: 100%;
      max-width: 240px;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1a6bb5, #3da5ff, #7ec8ff);
      border-radius: 10px;
      transition: width 0.15s linear;
      position: relative;
      box-shadow: 0 0 10px rgba(61, 165, 255, 0.65);
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-percent {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .motion-dots {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .motion-dots span {
      width: 5px;
      height: 5px;
      background: #3da5ff;
      border-radius: 50%;
      animation: bounce-dot 1.4s ease-in-out infinite;
    }
    .motion-dots span:nth-child(2) { animation-delay: 0.2s; }
    .motion-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1.15); opacity: 1; }
    }

    /* ========== SPLASH ========== */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease;
      z-index: 100;
    }

    #splash-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    .poster-bg {
      position: absolute;
      inset: 0;
      background-image: url('airborne_aces_poster.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .poster-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 58%,
        rgba(5, 15, 30, 0.45) 80%,
        rgba(5, 15, 30, 0.78) 100%
      );
      pointer-events: none;
    }

    .crystal-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42%;
      max-width: 280px;
      aspect-ratio: 0.72;
      pointer-events: none;
      z-index: 5;
    }

    .crystal-glow .core {
      position: absolute;
      inset: 15% 20%;
      background: radial-gradient(
        ellipse at center,
        rgba(120, 220, 255, 0.55) 0%,
        rgba(40, 140, 255, 0.25) 40%,
        transparent 70%
      );
      border-radius: 40% 40% 45% 45%;
      animation: crystal-pulse 2.8s ease-in-out infinite;
      filter: blur(4px);
    }

    .crystal-glow .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(180, 240, 255, 0.9);
      animation: sparkle-float 3s ease-in-out infinite;
    }

    @keyframes crystal-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); filter: blur(4px) brightness(1); }
      50% { opacity: 1; transform: scale(1.08); filter: blur(6px) brightness(1.3); }
    }

    @keyframes sparkle-float {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      20% { opacity: 1; }
      50% { opacity: 0.9; transform: translateY(-18px) scale(1.1); }
      80% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-30px) scale(0.3); }
    }

    .crystal-aura {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      max-width: 360px;
      aspect-ratio: 1;
      background: radial-gradient(
        circle,
        rgba(80, 180, 255, 0.22) 0%,
        rgba(40, 120, 220, 0.08) 45%,
        transparent 70%
      );
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      animation: aura-breathe 4s ease-in-out infinite;
    }

    @keyframes aura-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    .enter-hangar-wrap {
      position: absolute;
      bottom: 7.5%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
      padding: 0 28px;
    }

    .enter-hangar-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 48px;
      min-width: 210px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(180, 220, 255, 0.55);
      border-radius: 50px;
      color: #e8f4ff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 4px 18px rgba(0, 30, 80, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .enter-hangar-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 55%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      animation: btn-shine 3.8s ease-in-out infinite;
    }

    @keyframes btn-shine {
      0% { left: -100%; }
      35%, 100% { left: 150%; }
    }

    .enter-hangar-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(200, 230, 255, 0.75);
    }

    .splash-footer {
      position: absolute;
      bottom: 2.2%;
      left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 1px;
      z-index: 20;
    }

    /* ========== BLIMP SELECT SCREEN ========== */
    #blimp-select {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0c1c32 0%, #071018 100%);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
      z-index: 200;
    }

    #blimp-select.visible {
      opacity: 1;
      visibility: visible;
    }

    .blimp-header {
      padding: 44px 20px 12px;
      text-align: center;
    }

    .blimp-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #e8f4ff;
      text-shadow: 0 0 18px rgba(80, 160, 255, 0.35);
    }

    .blimp-header p {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(160, 200, 240, 0.5);
      text-transform: uppercase;
    }

    .blimp-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 20px 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .blimp-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(120, 180, 255, 0.28);
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }

    .blimp-card:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(160, 210, 255, 0.55);
    }

    .blimp-card.selected {
      background: rgba(40, 110, 190, 0.28);
      border-color: rgba(120, 200, 255, 0.65);
      box-shadow: 0 0 20px rgba(50, 140, 255, 0.25);
    }

    .blimp-icon {
      width: 64px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a5a8a, #1a3a5c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      border: 1px solid rgba(150, 200, 255, 0.25);
    }

    .blimp-info {
      flex: 1;
      min-width: 0;
    }

    .blimp-name {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.5px;
      color: #eef6ff;
    }

    .blimp-desc {
      margin-top: 3px;
      font-size: 11px;
      color: rgba(180, 210, 240, 0.55);
      line-height: 1.35;
    }

    .blimp-stats {
      margin-top: 6px;
      display: flex;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(140, 190, 240, 0.7);
    }

    .blimp-stats span {
      background: rgba(255,255,255,0.06);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .blimp-footer {
      padding: 14px 20px 28px;
      display: flex;
      gap: 12px;
    }

    .blimp-footer button {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.12s, background 0.15s;
    }

    .blimp-footer button:active {
      transform: scale(0.97);
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border-color: rgba(140, 180, 230, 0.3);
      color: #c8dff5;
    }

    .btn-select {
      background: linear-gradient(180deg, rgba(40, 120, 200, 0.7), rgba(20, 80, 150, 0.7));
      border-color: rgba(120, 190, 255, 0.55);
      color: #fff;
    }

    .btn-select:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading-screen">
    <img class="logo-full" src="one_thumb_gaming_logo.png" alt="One Thumb Gaming">
    <div class="loading-area">
      <div class="loading-text">Loading Assets</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progress-text">0%</div>
      <div class="motion-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- SPLASH -->
  <div id="splash-screen">
    <div class="poster-bg"></div>
    <div class="crystal-aura"></div>
    <div class="crystal-glow" id="crystal-glow">
      <div class="core"></div>
    </div>
    <div class="enter-hangar-wrap">
      <button class="enter-hangar-btn" id="enter-hangar" onclick="enterHangar()">
        Enter Hangar
      </button>
    </div>
    <div class="splash-footer">ONE THUMB GAMING  •  AIRBORNE ACES 1933</div>
  </div>

  <!-- BLIMP SELECT (menu disabled for now) -->
  <div id="blimp-select">
    <div class="blimp-header">
      <h1>SELECT BLIMP</h1>
      <p>Choose your airship</p>
    </div>

    <div class="blimp-list" id="blimp-list">
      <!-- cards injected by JS -->
    </div>

    <div class="blimp-footer">
      <button class="btn-back" onclick="backToSplash()">Back</button>
      <button class="btn-select" id="btn-confirm" disabled onclick="confirmBlimp()">Select</button>
    </div>
  </div>

  <script>
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const loadingScreen = document.getElementById('loading-screen');
    const splashScreen = document.getElementById('splash-screen');
    const blimpSelect = document.getElementById('blimp-select');
    const btnConfirm = document.getElementById('btn-confirm');

    const posterImg = new Image();
    posterImg.src = 'airborne_aces_poster.png';

    // Blimp roster (placeholder – replace with real assets later)
    const blimps = [
      {
        id: 'zeppelin-ace',
        name: 'Zeppelin Ace',
        desc: 'Classic rigid airship. Balanced speed & firepower.',
        icon: '🎈',
        stats: ['SPD 3', 'ARM 4', 'GUN 3']
      },
      {
        id: 'sky-raider',
        name: 'Sky Raider',
        desc: 'Fast scout blimp. Light armor, high mobility.',
        icon: '✈️',
        stats: ['SPD 5', 'ARM 2', 'GUN 2']
      },
      {
        id: 'ironclad',
        name: 'Ironclad',
        desc: 'Heavy armored behemoth. Slow but devastating.',
        icon: '🛡️',
        stats: ['SPD 2', 'ARM 5', 'GUN 4']
      },
      {
        id: 'thunderbolt',
        name: 'Thunderbolt',
        desc: 'Experimental storm-class. Lightning weapons.',
        icon: '⚡',
        stats: ['SPD 4', 'ARM 3', 'GUN 5']
      },
      {
        id: 'cloud-hopper',
        name: 'Cloud Hopper',
        desc: 'Lightweight observation craft. Stealthy.',
        icon: '☁️',
        stats: ['SPD 4', 'ARM 1', 'GUN 1']
      }
    ];

    let selectedBlimp = null;

    function renderBlimps() {
      const list = document.getElementById('blimp-list');
      list.innerHTML = '';
      blimps.forEach(b => {
        const card = document.createElement('div');
        card.className = 'blimp-card';
        card.dataset.id = b.id;
        card.innerHTML = `
          <div class="blimp-icon">${b.icon}</div>
          <div class="blimp-info">
            <div class="blimp-name">${b.name}</div>
            <div class="blimp-desc">${b.desc}</div>
            <div class="blimp-stats">${b.stats.map(s => '<span>' + s + '</span>').join('')}</div>
          </div>
        `;
        card.addEventListener('click', function() { selectBlimp(b.id, card); });
        list.appendChild(card);
      });
    }

    function selectBlimp(id, cardEl) {
      selectedBlimp = id;
      document.querySelectorAll('.blimp-card').forEach(c => c.classList.remove('selected'));
      cardEl.classList.add('selected');
      btnConfirm.disabled = false;
    }

    function confirmBlimp() {
      if (!selectedBlimp) return;
      console.log('Selected blimp:', selectedBlimp);
      btnConfirm.textContent = 'Ready…';
      btnConfirm.disabled = true;
      setTimeout(function() {
        btnConfirm.textContent = 'Select';
        btnConfirm.disabled = false;
      }, 800);
    }

    function backToSplash() {
      blimpSelect.style.opacity = '0';
      setTimeout(function() {
        blimpSelect.classList.remove('visible');
        blimpSelect.style.visibility = 'hidden';
        splashScreen.style.visibility = 'visible';
        splashScreen.style.opacity = '1';
        splashScreen.classList.add('visible');
        var btn = document.getElementById('enter-hangar');
        btn.style.pointerEvents = '';
        btn.style.opacity = '';
      }, 500);
    }

    // ---------- Loading sequence ----------
    let progress = 0;
    const assets = [
      { weight: 18 }, { weight: 22 }, { weight: 12 },
      { weight: 10 }, { weight: 15 }, { weight: 13 }, { weight: 10 }
    ];
    let currentAsset = 0;
    let loadedWeight = 0;
    const totalWeight = assets.reduce(function(s, a) { return s + a.weight; }, 0);

    function loadNextAsset() {
      if (currentAsset >= assets.length) {
        if (posterImg.complete) finishLoading();
        else posterImg.onload = finishLoading;
        return;
      }
      const asset = assets[currentAsset];
      const start = loadedWeight;
      const end = loadedWeight + asset.weight;
      const duration = 280 + Math.random() * 420;
      const startTime = performance.now();

      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 2.2);
        progress = start + (end - start) * eased;
        const pct = Math.min(99, Math.round((progress / totalWeight) * 100));
        progressFill.style.width = pct + '%';
        progressText.textContent = pct + '%';
        if (t < 1) requestAnimationFrame(tick);
        else {
          loadedWeight = end;
          currentAsset++;
          setTimeout(loadNextAsset, 90 + Math.random() * 120);
        }
      }
      requestAnimationFrame(tick);
    }

    function finishLoading() {
      progressFill.style.width = '100%';
      progressText.textContent = '100%';
      document.querySelector('.loading-text').textContent = 'Ready';
      setTimeout(function() {
        loadingScreen.classList.add('hidden');
        splashScreen.classList.add('visible');
        createSparkles();
        renderBlimps();
      }, 450);
    }

    setTimeout(loadNextAsset, 350);

    function createSparkles() {
      const container = document.getElementById('crystal-glow');
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = (15 + Math.random() * 70) + '%';
        s.style.top = (20 + Math.random() * 60) + '%';
        s.style.animationDelay = (Math.random() * 2.8) + 's';
        s.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
        if (Math.random() > 0.7) {
          s.style.width = '6px';
          s.style.height = '6px';
        }
        container.appendChild(s);
      }
    }

    // Go straight to blimp select (menu disabled until later)
    function enterHangar() {
      const btn = document.getElementById('enter-hangar');
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.5';

      splashScreen.style.opacity = '0';
      setTimeout(function() {
        splashScreen.classList.remove('visible');
        splashScreen.style.visibility = 'hidden';
        blimpSelect.classList.add('visible');
      }, 500);
    }

    document.addEventListener('touchmove', function(e) {
      if (!e.target.closest('.blimp-list')) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
