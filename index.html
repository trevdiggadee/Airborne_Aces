<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Airborne Aces 1933 - One Thumb Gaming</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    /* ========== LOADING SCREEN ========== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-container {
      width: 70%;
      max-width: 320px;
      position: relative;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.4));
    }

    .loading-area {
      position: absolute;
      bottom: 8%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
    }

    .loading-text {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7eb8e8;
      font-weight: 500;
      animation: pulse-text 1.5s ease-in-out infinite;
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .progress-bar-track {
      width: 100%;
      max-width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1a6bb5, #3da5ff, #7ec8ff);
      border-radius: 10px;
      transition: width 0.15s linear;
      position: relative;
      box-shadow: 0 0 12px rgba(61, 165, 255, 0.7);
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-percent {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-variant-numeric: tabular-nums;
    }

    /* Motion dots */
    .motion-dots {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .motion-dots span {
      width: 6px;
      height: 6px;
      background: #3da5ff;
      border-radius: 50%;
      animation: bounce-dot 1.4s ease-in-out infinite;
    }

    .motion-dots span:nth-child(2) { animation-delay: 0.2s; }
    .motion-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* ========== SPLASH / MAIN SCREEN ========== */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease;
      z-index: 100;
    }

    #splash-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    .poster-bg {
      position: absolute;
      inset: 0;
      background-image: url('airborne_aces_poster.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    /* Soft vignette to help button readability */
    .poster-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 55%,
        rgba(5, 15, 30, 0.55) 78%,
        rgba(5, 15, 30, 0.85) 100%
      );
      pointer-events: none;
    }

    /* Crystal glow overlay – centered over the crystal in the art */
    .crystal-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42%;
      max-width: 280px;
      aspect-ratio: 0.72;
      pointer-events: none;
      z-index: 5;
    }

    .crystal-glow .core {
      position: absolute;
      inset: 15% 20%;
      background: radial-gradient(
        ellipse at center,
        rgba(120, 220, 255, 0.55) 0%,
        rgba(40, 140, 255, 0.25) 40%,
        transparent 70%
      );
      border-radius: 40% 40% 45% 45%;
      animation: crystal-pulse 2.8s ease-in-out infinite;
      filter: blur(4px);
    }

    .crystal-glow .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(180, 240, 255, 0.9);
      animation: sparkle-float 3s ease-in-out infinite;
    }

    @keyframes crystal-pulse {
      0%, 100% {
        opacity: 0.7;
        transform: scale(1);
        filter: blur(4px) brightness(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
        filter: blur(6px) brightness(1.3);
      }
    }

    @keyframes sparkle-float {
      0%, 100% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      20% { opacity: 1; }
      50% {
        opacity: 0.9;
        transform: translateY(-18px) scale(1.1);
      }
      80% { opacity: 0.3; }
      100% {
        opacity: 0;
        transform: translateY(-30px) scale(0.3);
      }
    }

    /* Extra outer aura */
    .crystal-aura {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      max-width: 360px;
      aspect-ratio: 1;
      background: radial-gradient(
        circle,
        rgba(80, 180, 255, 0.22) 0%,
        rgba(40, 120, 220, 0.08) 45%,
        transparent 70%
      );
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      animation: aura-breathe 4s ease-in-out infinite;
    }

    @keyframes aura-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Enter Hangar Button */
    .enter-hangar-wrap {
      position: absolute;
      bottom: 7%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
      padding: 0 24px;
    }

    .enter-hangar-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 42px;
      min-width: 220px;
      background: linear-gradient(180deg, #2a6fbf 0%, #1a4a8a 100%);
      border: 2px solid #7ec8ff;
      border-radius: 50px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      box-shadow:
        0 0 0 3px rgba(30, 90, 160, 0.4),
        0 8px 24px rgba(0, 40, 100, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      overflow: hidden;
    }

    .enter-hangar-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.22),
        transparent
      );
      animation: btn-shine 3.5s ease-in-out infinite;
    }

    @keyframes btn-shine {
      0% { left: -100%; }
      40%, 100% { left: 150%; }
    }

    .enter-hangar-btn:hover,
    .enter-hangar-btn:active {
      transform: scale(1.04);
      filter: brightness(1.12);
      box-shadow:
        0 0 0 3px rgba(50, 140, 220, 0.55),
        0 10px 28px rgba(0, 60, 140, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .enter-hangar-btn .icon {
      font-size: 20px;
      line-height: 1;
    }

    /* Subtle wing accents on button */
    .enter-hangar-btn .wing {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 10px;
      background: rgba(180, 220, 255, 0.35);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    .enter-hangar-btn .wing.left {
      left: 12px;
      transform: translateY(-50%) scaleX(-1);
    }

    .enter-hangar-btn .wing.right {
      right: 12px;
      transform: translateY(-50%);
    }

    /* Version / footer */
    .splash-footer {
      position: absolute;
      bottom: 2.2%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- ========== LOADING SCREEN (One Thumb Gaming) ========== -->
  <div id="loading-screen">
    <div class="logo-container">
      <img src="one_thumb_gaming_logo.png" alt="One Thumb Gaming">
    </div>

    <div class="loading-area">
      <div class="loading-text">Loading Assets</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progress-text">0%</div>
      <div class="motion-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ========== SPLASH SCREEN (Airborne Aces poster) ========== -->
  <div id="splash-screen">
    <div class="poster-bg"></div>

    <!-- Crystal aura + glow effects -->
    <div class="crystal-aura"></div>
    <div class="crystal-glow" id="crystal-glow">
      <div class="core"></div>
      <!-- Sparkles will be injected by JS -->
    </div>

    <div class="enter-hangar-wrap">
      <button class="enter-hangar-btn" id="enter-hangar" onclick="enterHangar()">
        <span class="wing left"></span>
        <span class="icon">✈</span>
        <span>Enter Hangar</span>
        <span class="wing right"></span>
      </button>
    </div>

    <div class="splash-footer">ONE THUMB GAMING  •  AIRBORNE ACES 1933</div>
  </div>

  <script>
    // ---------- Simulated asset loading ----------
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const loadingScreen = document.getElementById('loading-screen');
    const splashScreen = document.getElementById('splash-screen');

    // Preload the big poster so it is ready when we transition
    const posterImg = new Image();
    posterImg.src = 'airborne_aces_poster.png';

    // Fake progressive loading of game assets
    let progress = 0;
    const assets = [
      { name: 'Textures', weight: 18 },
      { name: 'Aircraft Models', weight: 22 },
      { name: 'Audio', weight: 12 },
      { name: 'UI Assets', weight: 10 },
      { name: 'Particle Systems', weight: 15 },
      { name: 'Level Data', weight: 13 },
      { name: 'Shaders', weight: 10 }
    ];

    let currentAsset = 0;
    let loadedWeight = 0;
    const totalWeight = assets.reduce((s, a) => s + a.weight, 0);

    function loadNextAsset() {
      if (currentAsset >= assets.length) {
        // Ensure poster is fully loaded before transition
        if (posterImg.complete) {
          finishLoading();
        } else {
          posterImg.onload = finishLoading;
        }
        return;
      }

      const asset = assets[currentAsset];
      const start = loadedWeight;
      const end = loadedWeight + asset.weight;
      const duration = 280 + Math.random() * 420; // varied timing
      const startTime = performance.now();

      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        // ease-out
        const eased = 1 - Math.pow(1 - t, 2.2);
        progress = start + (end - start) * eased;
        const pct = Math.min(99, Math.round((progress / totalWeight) * 100));
        progressFill.style.width = pct + '%';
        progressText.textContent = pct + '%';

        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          loadedWeight = end;
          currentAsset++;
          // small pause between assets
          setTimeout(loadNextAsset, 90 + Math.random() * 120);
        }
      }
      requestAnimationFrame(tick);
    }

    function finishLoading() {
      progressFill.style.width = '100%';
      progressText.textContent = '100%';
      document.querySelector('.loading-text').textContent = 'Ready';

      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        splashScreen.classList.add('visible');
        createSparkles();
      }, 450);
    }

    // Start loading sequence after a short initial delay
    setTimeout(loadNextAsset, 400);

    // ---------- Crystal sparkles ----------
    function createSparkles() {
      const container = document.getElementById('crystal-glow');
      const count = 14;

      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const x = 15 + Math.random() * 70;
        const y = 20 + Math.random() * 60;
        s.style.left = x + '%';
        s.style.top = y + '%';
        s.style.animationDelay = (Math.random() * 2.8) + 's';
        s.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
        // occasional larger sparkles
        if (Math.random() > 0.7) {
          s.style.width = '6px';
          s.style.height = '6px';
        }
        container.appendChild(s);
      }
    }

    // ---------- Enter Hangar ----------
    function enterHangar() {
      const btn = document.getElementById('enter-hangar');
      btn.style.transform = 'scale(0.96)';
      btn.style.filter = 'brightness(0.9)';

      // Simple feedback – in a real game this would load the hangar scene
      setTimeout(() => {
        alert('Entering Hangar…\n\n(In the full game this would transition to the Hangar scene.)');
        btn.style.transform = '';
        btn.style.filter = '';
      }, 180);
    }

    // Prevent accidental zoom / scroll on mobile
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
