<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Airborne Aces 1933 - One Thumb Gaming</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    /* ========== LOADING SCREEN (full-screen logo) ========== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Full-screen logo image */
    .logo-full {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .loading-area {
      position: absolute;
      bottom: 9%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      z-index: 10;
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(180, 210, 240, 0.85);
      font-weight: 500;
      animation: pulse-text 1.5s ease-in-out infinite;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .progress-bar-track {
      width: 100%;
      max-width: 240px;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1a6bb5, #3da5ff, #7ec8ff);
      border-radius: 10px;
      transition: width 0.15s linear;
      position: relative;
      box-shadow: 0 0 10px rgba(61, 165, 255, 0.65);
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 100%
      );
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-percent {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .motion-dots {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .motion-dots span {
      width: 5px;
      height: 5px;
      background: #3da5ff;
      border-radius: 50%;
      animation: bounce-dot 1.4s ease-in-out infinite;
    }

    .motion-dots span:nth-child(2) { animation-delay: 0.2s; }
    .motion-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1.15); opacity: 1; }
    }

    /* ========== SPLASH / MAIN SCREEN ========== */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0a1628;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease;
      z-index: 100;
    }

    #splash-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    .poster-bg {
      position: absolute;
      inset: 0;
      background-image: url('airborne_aces_poster.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    /* Soft vignette so button stays readable */
    .poster-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 58%,
        rgba(5, 15, 30, 0.45) 80%,
        rgba(5, 15, 30, 0.78) 100%
      );
      pointer-events: none;
    }

    /* Crystal glow overlay */
    .crystal-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42%;
      max-width: 280px;
      aspect-ratio: 0.72;
      pointer-events: none;
      z-index: 5;
    }

    .crystal-glow .core {
      position: absolute;
      inset: 15% 20%;
      background: radial-gradient(
        ellipse at center,
        rgba(120, 220, 255, 0.55) 0%,
        rgba(40, 140, 255, 0.25) 40%,
        transparent 70%
      );
      border-radius: 40% 40% 45% 45%;
      animation: crystal-pulse 2.8s ease-in-out infinite;
      filter: blur(4px);
    }

    .crystal-glow .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(180, 240, 255, 0.9);
      animation: sparkle-float 3s ease-in-out infinite;
    }

    @keyframes crystal-pulse {
      0%, 100% {
        opacity: 0.7;
        transform: scale(1);
        filter: blur(4px) brightness(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
        filter: blur(6px) brightness(1.3);
      }
    }

    @keyframes sparkle-float {
      0%, 100% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      20% { opacity: 1; }
      50% {
        opacity: 0.9;
        transform: translateY(-18px) scale(1.1);
      }
      80% { opacity: 0.3; }
      100% {
        opacity: 0;
        transform: translateY(-30px) scale(0.3);
      }
    }

    .crystal-aura {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      max-width: 360px;
      aspect-ratio: 1;
      background: radial-gradient(
        circle,
        rgba(80, 180, 255, 0.22) 0%,
        rgba(40, 120, 220, 0.08) 45%,
        transparent 70%
      );
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      animation: aura-breathe 4s ease-in-out infinite;
    }

    @keyframes aura-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* ========== Enter Hangar – transparent style ========== */
    .enter-hangar-wrap {
      position: absolute;
      bottom: 7.5%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
      padding: 0 28px;
    }

    .enter-hangar-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 48px;
      min-width: 210px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(180, 220, 255, 0.55);
      border-radius: 50px;
      color: #e8f4ff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 4px 18px rgba(0, 30, 80, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .enter-hangar-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.18),
        transparent
      );
      animation: btn-shine 3.8s ease-in-out infinite;
    }

    @keyframes btn-shine {
      0% { left: -100%; }
      35%, 100% { left: 150%; }
    }

    .enter-hangar-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(200, 230, 255, 0.75);
    }

    .splash-footer {
      position: absolute;
      bottom: 2.2%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 1px;
      z-index: 20;
    }

    /* After entering hangar – simple next state */
    #hangar-placeholder {
      position: fixed;
      inset: 0;
      background: #061018;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease;
      z-index: 200;
    }

    #hangar-placeholder.visible {
      opacity: 1;
      visibility: visible;
    }

    #hangar-placeholder h2 {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: 600;
      color: #a8d4ff;
    }

    #hangar-placeholder p {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- ========== LOADING SCREEN (full-screen One Thumb) ========== -->
  <div id="loading-screen">
    <img class="logo-full" src="one_thumb_gaming_logo.png" alt="One Thumb Gaming">

    <div class="loading-area">
      <div class="loading-text">Loading Assets</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progress-text">0%</div>
      <div class="motion-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ========== SPLASH SCREEN ========== -->
  <div id="splash-screen">
    <div class="poster-bg"></div>

    <div class="crystal-aura"></div>
    <div class="crystal-glow" id="crystal-glow">
      <div class="core"></div>
    </div>

    <div class="enter-hangar-wrap">
      <button class="enter-hangar-btn" id="enter-hangar" onclick="enterHangar()">
        Enter Hangar
      </button>
    </div>

    <div class="splash-footer">ONE THUMB GAMING  •  AIRBORNE ACES 1933</div>
  </div>

  <!-- Simple next screen after button press -->
  <div id="hangar-placeholder">
    <h2>HANGAR</h2>
    <p>Scene loading…</p>
  </div>

  <script>
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const loadingScreen = document.getElementById('loading-screen');
    const splashScreen = document.getElementById('splash-screen');
    const hangarPlaceholder = document.getElementById('hangar-placeholder');

    // Preload poster
    const posterImg = new Image();
    posterImg.src = 'airborne_aces_poster.png';

    let progress = 0;
    const assets = [
      { name: 'Textures', weight: 18 },
      { name: 'Aircraft Models', weight: 22 },
      { name: 'Audio', weight: 12 },
      { name: 'UI Assets', weight: 10 },
      { name: 'Particle Systems', weight: 15 },
      { name: 'Level Data', weight: 13 },
      { name: 'Shaders', weight: 10 }
    ];

    let currentAsset = 0;
    let loadedWeight = 0;
    const totalWeight = assets.reduce((s, a) => s + a.weight, 0);

    function loadNextAsset() {
      if (currentAsset >= assets.length) {
        if (posterImg.complete) {
          finishLoading();
        } else {
          posterImg.onload = finishLoading;
        }
        return;
      }

      const asset = assets[currentAsset];
      const start = loadedWeight;
      const end = loadedWeight + asset.weight;
      const duration = 280 + Math.random() * 420;
      const startTime = performance.now();

      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 2.2);
        progress = start + (end - start) * eased;
        const pct = Math.min(99, Math.round((progress / totalWeight) * 100));
        progressFill.style.width = pct + '%';
        progressText.textContent = pct + '%';

        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          loadedWeight = end;
          currentAsset++;
          setTimeout(loadNextAsset, 90 + Math.random() * 120);
        }
      }
      requestAnimationFrame(tick);
    }

    function finishLoading() {
      progressFill.style.width = '100%';
      progressText.textContent = '100%';
      document.querySelector('.loading-text').textContent = 'Ready';

      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        splashScreen.classList.add('visible');
        createSparkles();
      }, 450);
    }

    setTimeout(loadNextAsset, 350);

    function createSparkles() {
      const container = document.getElementById('crystal-glow');
      const count = 14;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = (15 + Math.random() * 70) + '%';
        s.style.top = (20 + Math.random() * 60) + '%';
        s.style.animationDelay = (Math.random() * 2.8) + 's';
        s.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
        if (Math.random() > 0.7) {
          s.style.width = '6px';
          s.style.height = '6px';
        }
        container.appendChild(s);
      }
    }

    // No alert – clean transition past the button
    function enterHangar() {
      const btn = document.getElementById('enter-hangar');
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.55';
      btn.style.transform = 'scale(0.97)';

      // Fade splash out and show next screen
      setTimeout(() => {
        splashScreen.style.opacity = '0';
        setTimeout(() => {
          hangarPlaceholder.classList.add('visible');
        }, 400);
      }, 180);
    }

    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
